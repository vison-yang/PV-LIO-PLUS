time_offset: 0.0                         # s; zero when LiDAR and IMU share a clock

common:
    lid_topic: "/livox/lidar"
    imu_topic: "/livox/imu"
    time_sync_en: false                   # enable only without a shared clock

preprocess:
    lidar_type: 1                          # 1=Livox/Avia, 2=Velodyne, 3=Ouster
    scan_line: 6
    scan_rate: 10
    blind: 0.1                             # m
    maximum_range: 70.0                    # m
    vertical_angle_min: -45.0              # deg
    vertical_angle_max: 45.0               # deg
    horizontal_angle_min: -180.0            # deg
    horizontal_angle_max: 180.0             # deg
    point_filter_num: 1
    feature_extract_enable: false

mapping:
    map_type: voxelmap_plus                # voxelmap, voxelmap_plus, ikdtree, ivox, c3p_voxelmap
    local_window_en: false
    down_sample_size: 0.1                 # m
    max_iteration: 10
    det_range: 100.0                      # m; local-window half extent

    voxel_size: 0.5                       # m
    max_layer: 4                           # valid layer indices: 0..max_layer
    layer_point_size: [5, 5, 5, 5, 5]     # layers 0..max_layer
    plannar_threshold: 0.01                # keep historical spelling; key read by the node
    max_points_size: 1000
    max_cov_points_size: 1000
    sigma_num: 3
    update_size_threshold: 5                # VoxelMap++ only

    nearest_point_count: 5
    nearest_max_range: 5.0                 # m for iVox; squared-distance path in ikd-tree
    plane_fit_threshold: 0.1
    point_map_downsample_size: 0.1         # m

    ikd_delete_param: 0.5
    ikd_balance_param: 0.7
    ikd_box_length: 0.2                    # m

    ivox_resolution: 0.2                  # m
    ivox_nearby_type: 18                   # 0, 6, 18 or 26 neighboring voxels
    ivox_capacity: 1000000

    c3p_enable_voxel_merging: false
    c3p_merge_theta_thresh: 0.05
    c3p_merge_dist_thresh: 0.05
    c3p_merge_cov_min_eigen_val_thresh: 0.002
    c3p_merge_x_coord_diff_thresh: 5.0
    c3p_merge_y_coord_diff_thresh: 5.0

    extrinsic_est_en: false                 # enable online IMU-LiDAR extrinsic estimation
    extrinsic_T: [0.04165, 0.02326, -0.0284] # LiDAR-to-IMU translation [m]
    extrinsic_R: [1, 0, 0,
                  0, 1, 0,
                  0, 0, 1]                 # row-major LiDAR-to-IMU rotation

noise_model:
    ranging_cov: 0.03
    angle_cov: 0.15
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001

publish:
    pub_voxel_map: false
    map_en: true
    publish_max_voxel_layer: 2             # publish layers 0..2
    path_en: true
    scan_publish_en: true                  # enable point-cloud output
    dense_publish_en: false                # reduce global-frame point-cloud density
    scan_bodyframe_pub_en: false           # publish scan in IMU-body frame
    scan_lidarframe_pub_en: true           # publish scan in LiDAR frame

pcd_save:
    pcd_save_en: true
    interval: -1                           # frames/file; -1 writes all frames to one file
