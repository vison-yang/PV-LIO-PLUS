time_offset: 0.0                         # s; zero when LiDAR and IMU share a clock

common:
    lid_topic: "/lidar/data"             # fields x,y,z,intensity,time,ring; timestamp aliases time
    imu_topic: "/s316_imu"
    time_sync_en: false                   # enable only without a shared clock

preprocess:
    lidar_type: 4                         # 1=Livox/Avia, 2=Velodyne, 3=Ouster, 4=SOLID PointCloud2
    scan_line: 6
    scan_rate: 10
    blind: 0.2                         # m
    maximum_range: 70.0                # m
    vertical_angle_min: -45.0          # deg
    vertical_angle_max: 45.0           # deg
    horizontal_angle_min: -60.0        # deg
    horizontal_angle_max: 60.0         # deg
    point_filter_num: 2
    feature_extract_enable: false

mapping:
    down_sample_size: 0.5                 # m
    max_iteration: 4
    extrinsic_est_en: false               # enable online IMU-LiDAR extrinsic estimation
    # extrinsic_T: [0.0, -0.037, -0.02124] # extrinsic_T_I2L, consumed as LiDAR-to-IMU [m]
    # extrinsic_R: [-0.00463911, -0.02533197, -0.99966833,
    #               0.00352892, -0.99967328, 0.02531572,
    #               -0.99998301, -0.00341031, 0.00472699] # R_I2L, row-major LiDAR-to-IMU rotation
    extrinsic_T: [0.0, -0.037, -0.02124] # extrinsic_T_I2L, consumed as LiDAR-to-IMU [m]
    extrinsic_R: [0, 0, -1,
                  0, -1, 0,
                  -1, 0, 0] # R_I2L, row-major LiDAR-to-IMU rotation
noise_model:
    ranging_cov: 0.05
    angle_cov: 0.0001
    acc_cov: 0.3
    gyr_cov: 0.1
    b_acc_cov: 0.005
    b_gyr_cov: 0.001

publish:
    pub_voxel_map: false
    map_en: true
    publish_max_voxel_layer: 2             # publish layers 0..2
    path_en: true
    scan_publish_en: true                  # enable point-cloud output
    dense_publish_en: false                # reduce global-frame point-cloud density
    scan_bodyframe_pub_en: false           # publish scan in IMU-body frame
    scan_lidarframe_pub_en: true           # publish scan in LiDAR frame

pcd_save:
    pcd_save_en: true
    interval: -1                           # frames/file; -1 writes all frames to one file

logging:
    timing_en: false                       # print per-frame pose/timing and write a CSV when enabled
    timing_path: ""                         # empty: output/pv_lio_ivox_timing.csv; otherwise an explicit CSV path
